<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAMD — APK Malware Analysis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="light"] {
      --bg: #ffffff;
      --surface: #f9f9fb;
      --surface-2: #f1f3f5;
      --border: #e5e7eb;
      --border-focus: #3b82f6;
      --text: #0d0d0d;
      --text-muted: #6b7280;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --chatbar-bg: #f4f4f5;
      --msg-user: #f4f4f5;
      --msg-bot: #ffffff;
      --danger-bg: #fef2f2;
      --danger-text: #b91c1c;
      --danger-border: #fecaca;
      --success-bg: #f0fdf4;
      --success-text: #15803d;
      --success-border: #bbf7d0;
      --step-bg: #f8fafc;
    }

    :root[data-theme="dark"] {
      --bg: #212121;
      --surface: #2f2f2f;
      --surface-2: #383838;
      --border: #424242;
      --border-focus: #60a5fa;
      --text: #ececec;
      --text-muted: #b4b4b4;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --chatbar-bg: #2f2f2f;
      --msg-user: #2f2f2f;
      --msg-bot: #212121;
      --danger-bg: #451a1a;
      --danger-text: #f87171;
      --danger-border: #7f1d1d;
      --success-bg: #143521;
      --success-text: #4ade80;
      --success-border: #166534;
      --step-bg: #2a2a2a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background 0.2s, color 0.2s;
    }

    /* Top Bar */
    header {
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
    }
    .header-title {
      font-weight: 600;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-title span.badge {
      font-size: 11px;
      font-weight: 500;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--surface-2);
      color: var(--text-muted);
    }
    .theme-toggle-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s;
    }
    .theme-toggle-btn:hover {
      background: var(--surface);
    }

    /* Chat Messages Stream */
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }
    .chat-inner {
      max-width: 768px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Welcome Empty State */
    .welcome-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: auto 0;
      text-align: center;
      padding: 40px 16px;
    }
    .welcome-icon {
      font-size: 32px;
      margin-bottom: 12px;
    }
    .welcome-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .welcome-sub {
      font-size: 13.5px;
      color: var(--text-muted);
      max-width: 460px;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .sample-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 8px;
      width: 100%;
      max-width: 600px;
    }
    .sample-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      text-align: left;
      font-size: 12.5px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .sample-card:hover {
      border-color: var(--primary);
      background: var(--surface-2);
    }
    .sample-card-title {
      font-weight: 600;
      color: var(--text);
      margin-bottom: 2px;
    }
    .sample-card-desc {
      font-size: 11.5px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    /* Message Bubbles */
    .msg-row {
      display: flex;
      gap: 12px;
      width: 100%;
    }
    .msg-row.user {
      justify-content: flex-end;
    }
    .msg-row.bot {
      justify-content: flex-start;
    }

    .msg-bubble {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
      word-wrap: break-word;
    }
    .msg-row.user .msg-bubble {
      background: var(--msg-user);
      color: var(--text);
      border-bottom-right-radius: 4px;
    }
    .msg-row.bot .msg-bubble {
      background: var(--msg-bot);
      color: var(--text);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      width: 100%;
      max-width: 100%;
    }

    /* Live Procedural Steps */
    .step-tracker {
      background: var(--step-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12.5px;
    }
    .step-line {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .step-status-icon {
      font-size: 12px;
      font-weight: bold;
      width: 16px;
      text-align: center;
    }
    .step-line.done .step-status-icon { color: var(--success-text); }
    .step-line.running .step-status-icon { color: var(--primary); }
    .step-line.pending .step-status-icon { color: var(--text-muted); }
    .step-name { font-weight: 500; }
    .step-detail { color: var(--text-muted); font-size: 11.5px; font-family: 'JetBrains Mono', monospace; margin-left: auto; }

    /* Verdict Card Inside Message */
    .verdict-box {
      border-radius: 8px;
      overflow: hidden;
      margin-top: 6px;
    }
    .verdict-header {
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 700;
      font-size: 14px;
    }
    .verdict-header.malware {
      background: var(--danger-bg);
      color: var(--danger-text);
      border: 1px solid var(--danger-border);
    }
    .verdict-header.benign {
      background: var(--success-bg);
      color: var(--success-text);
      border: 1px solid var(--success-border);
    }
    .confidence-tag {
      font-size: 11.5px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.06);
    }

    .verdict-section-title {
      font-size: 11.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-top: 14px;
      margin-bottom: 6px;
    }
    .verdict-purpose {
      font-size: 13.5px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: 6px;
      line-height: 1.5;
    }
    .findings-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .findings-list li {
      font-size: 13px;
      padding: 6px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }
    .findings-list li::before {
      content: "•";
      color: var(--primary);
      font-weight: bold;
    }
    details {
      margin-top: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
    }
    summary {
      padding: 8px 12px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
    }
    .details-text {
      padding: 10px 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      white-space: pre-wrap;
      word-wrap: break-word;
      border-top: 1px solid var(--border);
      max-height: 220px;
      overflow-y: auto;
      color: var(--text-muted);
    }

    /* Fixed Bottom Chatbar (ChatGPT Style) */
    .chatbar-container {
      padding: 12px 16px 20px;
      background: var(--bg);
      flex-shrink: 0;
    }
    .chatbar-box {
      max-width: 768px;
      margin: 0 auto;
      background: var(--chatbar-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      transition: border-color 0.15s;
    }
    .chatbar-box:focus-within {
      border-color: var(--border-focus);
    }
    .chatbar-input-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }
    textarea#msg-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      resize: none;
      outline: none;
      max-height: 140px;
      min-height: 24px;
      line-height: 1.5;
    }
    textarea#msg-input::placeholder {
      color: var(--text-muted);
    }
    .chatbar-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 4px;
      border-top: 1px solid var(--border);
    }
    .chatbar-tools {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .upload-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px 6px;
      border-radius: 4px;
      transition: background 0.15s, color 0.15s;
    }
    .upload-btn:hover {
      background: var(--surface-2);
      color: var(--text);
    }
    .model-select-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .model-select-wrapper select {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 12px;
      padding: 3px 6px;
      border-radius: 4px;
      font-family: inherit;
      outline: none;
      cursor: pointer;
    }
    .send-btn {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      flex-shrink: 0;
    }
    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .chatbar-disclaimer {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header>
    <div class="header-title">
      LAMD Analyst
      <span class="badge">Malware Detection</span>
    </div>
    <button class="theme-toggle-btn" id="theme-btn" onclick="toggleTheme()">
      <span id="theme-icon">🌙</span>
      <span id="theme-text">Dark</span>
    </button>
  </header>

  <!-- Messages Stream -->
  <div id="chat-container">
    <div class="chat-inner" id="chat-inner">
      <!-- Initial Welcome State -->
      <div class="welcome-screen" id="welcome-screen">
        <div class="welcome-icon">🛡️</div>
        <div class="welcome-title">Android APK Malware Analysis</div>
        <div class="welcome-sub">
          Paste a SHA-256 hash, upload an APK file, or select a sample below to inspect code behavior and detect threats.
        </div>
        <div class="sample-grid" id="sample-grid">
          <!-- Populated dynamically -->
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Input Bar (ChatGPT Style) -->
  <div class="chatbar-container">
    <div class="chatbar-box">
      <div class="chatbar-input-row">
        <textarea id="msg-input" rows="1" placeholder="Paste a SHA-256 hash or ask a question..." oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="send-btn" onclick="handleSend()" title="Send">↑</button>
      </div>

      <div class="chatbar-footer">
        <div class="chatbar-tools">
          <input type="file" id="apk-file-input" accept=".apk" style="display:none;" onchange="handleFileUpload(this.files[0])">
          <button class="upload-btn" onclick="document.getElementById('apk-file-input').click()" title="Upload APK file">📎 Upload APK</button>
          
          <div class="model-select-wrapper">
            <span>Model:</span>
            <select id="backend-select">
              <option value="gemini">Gemini 2.5 Flash</option>
              <option value="groq">Groq (Llama 3.3)</option>
              <option value="gguf">Local Dual-GPU (32B)</option>
            </select>
          </div>
        </div>
        <span id="upload-status" style="font-size:11.5px; color:var(--text-muted);"></span>
      </div>
    </div>
    <div class="chatbar-disclaimer">
      LAMD analyzes Android APK bytecode using backward program slicing & LLMs.
    </div>
  </div>

  <script>
    let currentSha = null;
    let activeJobTimer = null;

    // Theme Switcher
    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('lamd-theme', theme);
      const isDark = theme === 'dark';
      document.getElementById('theme-icon').innerText = isDark ? '☀️' : '🌙';
      document.getElementById('theme-text').innerText = isDark ? 'Light' : 'Dark';
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      setTheme(current === 'light' ? 'dark' : 'light');
    }

    // Auto-resize textarea
    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 140) + 'px';
    }

    // Load sample cards
    async function loadSamples() {
      try {
        const resp = await fetch('/api/samples');
        const data = await resp.json();
        const grid = document.getElementById('sample-grid');
        grid.innerHTML = '';

        data.malware.slice(0, 2).forEach(item => {
          const card = document.createElement('div');
          card.className = 'sample-card';
          card.innerHTML = `
            <div class="sample-card-title">🚨 Malware: ${item.family}</div>
            <div class="sample-card-desc">${item.sha256.substring(0, 16)}...</div>
          `;
          card.onclick = () => submitHash(item.sha256);
          grid.appendChild(card);
        });

        data.benign.slice(0, 2).forEach(item => {
          const card = document.createElement('div');
          card.className = 'sample-card';
          card.innerHTML = `
            <div class="sample-card-title">✅ Benign: ${item.family}</div>
            <div class="sample-card-desc">${item.sha256.substring(0, 16)}...</div>
          `;
          card.onclick = () => submitHash(item.sha256);
          grid.appendChild(card);
        });
      } catch (e) {
        console.error('Failed to load samples:', e);
      }
    }

    function removeWelcome() {
      const w = document.getElementById('welcome-screen');
      if (w) w.remove();
    }

    function appendUserMessage(text) {
      removeWelcome();
      const inner = document.getElementById('chat-inner');
      const row = document.createElement('div');
      row.className = 'msg-row user';
      row.innerHTML = `<div class="msg-bubble">${escapeHtml(text)}</div>`;
      inner.appendChild(row);
      scrollToBottom();
    }

    function appendBotMessage(initialHtml = '') {
      removeWelcome();
      const inner = document.getElementById('chat-inner');
      const row = document.createElement('div');
      row.className = 'msg-row bot';
      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.innerHTML = initialHtml;
      row.appendChild(bubble);
      inner.appendChild(row);
      scrollToBottom();
      return bubble;
    }

    function scrollToBottom() {
      const c = document.getElementById('chat-container');
      c.scrollTop = c.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    // Submit Hash
    async function submitHash(sha) {
      appendUserMessage(`Analyze SHA-256: ${sha}`);
      currentSha = sha;
      const backend = document.getElementById('backend-select').value;
      const botBubble = appendBotMessage('<div class="step-tracker">Checking database & local CFG caches...</div>');

      try {
        const resp = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sha256: sha, backend: backend })
        });
        const data = await resp.json();

        if (data.status === 'cached') {
          renderVerdictInBubble(botBubble, data.result, "Loaded from cache (0 LLM tokens wasted)");
        } else if (data.job_id) {
          pollJobProgress(data.job_id, botBubble);
        } else {
          botBubble.innerHTML = `<span style="color:var(--danger-text);">Error: ${data.error || 'Request failed'}</span>`;
        }
      } catch (e) {
        botBubble.innerHTML = `<span style="color:var(--danger-text);">Network error: ${e}</span>`;
      }
    }

    // Handle File Upload
    async function handleFileUpload(file) {
      if (!file || !file.name.endsWith('.apk')) {
        alert('Please select a valid Android .apk file.');
        return;
      }
      appendUserMessage(`Uploaded APK: ${file.name} (${Math.round(file.size/1024)} KB)`);
      const backend = document.getElementById('backend-select').value;
      const botBubble = appendBotMessage('<div class="step-tracker">Uploading APK to analyzer...</div>');

      const formData = new FormData();
      formData.append('file', file);
      formData.append('backend', backend);

      try {
        const resp = await fetch('/api/upload', { method: 'POST', body: formData });
        const data = await resp.json();

        if (data.status === 'cached') {
          currentSha = data.result.sha256;
          renderVerdictInBubble(botBubble, data.result, "Previously analyzed APK");
        } else if (data.job_id) {
          currentSha = data.sha256;
          pollJobProgress(data.job_id, botBubble);
        } else {
          botBubble.innerHTML = `<span style="color:var(--danger-text);">Upload failed: ${data.error || 'Unknown error'}</span>`;
        }
      } catch (e) {
        botBubble.innerHTML = `<span style="color:var(--danger-text);">Error: ${e}</span>`;
      }
    }

    // Handle General Send (Hash or Follow-up Q&A)
    async function handleSend() {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      input.style.height = 'auto';

      // Check if text contains a 64-char hex SHA-256
      const shaMatch = text.match(/[a-fA-F0-9]{64}/);
      if (shaMatch) {
        submitHash(shaMatch[0].toLowerCase());
        return;
      }

      // Otherwise, it's a follow-up question
      appendUserMessage(text);
      const botBubble = appendBotMessage('Thinking...');
      const backend = document.getElementById('backend-select').value;

      try {
        const resp = await fetch('/api/explain', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sha256: currentSha || '',
            question: text,
            backend: backend
          })
        });
        const data = await resp.json();
        botBubble.innerText = data.reply || 'No response produced.';
      } catch (e) {
        botBubble.innerHTML = `<span style="color:var(--danger-text);">Error: ${e}</span>`;
      }
      scrollToBottom();
    }

    // Poll Job Progress
    function pollJobProgress(jobId, bubbleEl) {
      if (activeJobTimer) clearInterval(activeJobTimer);

      activeJobTimer = setInterval(async () => {
        try {
          const resp = await fetch(`/api/status/${jobId}`);
          const job = await resp.json();

          // Render live steps inside bubble
          let stepsHtml = '<div class="step-tracker">';
          (job.steps || []).forEach((step) => {
            let icon = '○';
            if (step.status === 'done') icon = '✓';
            if (step.status === 'running') icon = '●';
            if (step.status === 'error') icon = '✕';

            stepsHtml += `
              <div class="step-line ${step.status}">
                <span class="step-status-icon">${icon}</span>
                <span class="step-name">${step.name}</span>
                <span class="step-detail">${step.detail || ''}</span>
              </div>
            `;
          });
          stepsHtml += '</div>';
          bubbleEl.innerHTML = stepsHtml;
          scrollToBottom();

          if (job.status === 'done') {
            clearInterval(activeJobTimer);
            renderVerdictInBubble(bubbleEl, job.result);
          } else if (job.status === 'error') {
            clearInterval(activeJobTimer);
            bubbleEl.innerHTML += `<div style="color:var(--danger-text); margin-top:8px;">✕ Analysis failed: ${escapeHtml(job.error)}</div>`;
          }
        } catch (e) {
          console.error('Polling error:', e);
        }
      }, 1000);
    }

    function renderVerdictInBubble(bubbleEl, res, note = '') {
      const isMalware = (res.prediction || '').toUpperCase() === 'MALWARE';
      const statusClass = isMalware ? 'malware' : 'benign';
      const tagText = isMalware ? 'MALWARE DETECTED' : 'BENIGN APPLICATION';
      const conf = (res.confidence || 'HIGH').toUpperCase();

      let findingsHtml = '';
      (res.key_findings || []).forEach(f => {
        findingsHtml += `<li>${escapeHtml(f)}</li>`;
      });

      let noteHtml = note ? `<div style="font-size:11.5px; color:var(--text-muted); margin-bottom:8px;">${note}</div>` : '';

      bubbleEl.innerHTML = `
        ${noteHtml}
        <div class="verdict-box">
          <div class="verdict-header ${statusClass}">
            <span>${tagText}</span>
            <span class="confidence-tag">CONFIDENCE: ${conf}</span>
          </div>
        </div>

        <div class="verdict-section-title">Application Purpose</div>
        <div class="verdict-purpose">${escapeHtml(res.app_purpose || 'Standard application behavior.')}</div>

        ${findingsHtml ? `<div class="verdict-section-title">Key Indicators & Findings</div><ul class="findings-list">${findingsHtml}</ul>` : ''}

        <details>
          <summary>Technical Analysis & Evidence</summary>
          <div class="details-text">${escapeHtml(res.evidence || res.analysis || 'No detailed analysis text.')}</div>
        </details>
      `;
      scrollToBottom();
    }

    // Keyboard support: Enter to send, Shift+Enter for newline
    document.getElementById('msg-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });

    // Init theme from localStorage or system preference
    const savedTheme = localStorage.getItem('lamd-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    setTheme(savedTheme);
    loadSamples();
  </script>
</body>
</html>
