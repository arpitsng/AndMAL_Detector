<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Malware Detector</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="light"] {
      --bg: #ffffff;
      --surface: #f9f9fb;
      --surface-2: #f3f4f6;
      --border: #e5e7eb;
      --border-focus: #2563eb;
      --text: #111827;
      --text-muted: #6b7280;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --chatbar-bg: #f4f4f5;
      --msg-user: #f3f4f6;
      --msg-bot: #ffffff;
      --danger-bg: #fef2f2;
      --danger-text: #991b1b;
      --danger-border: #fecaca;
      --success-bg: #f0fdf4;
      --success-text: #166534;
      --success-border: #bbf7d0;
      --step-bg: #f9fafb;
    }

    :root[data-theme="dark"] {
      --bg: #18181b;
      --surface: #27272a;
      --surface-2: #3f3f46;
      --border: #3f3f46;
      --border-focus: #3b82f6;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --chatbar-bg: #27272a;
      --msg-user: #27272a;
      --msg-bot: #18181b;
      --danger-bg: #451a1a;
      --danger-text: #f87171;
      --danger-border: #7f1d1d;
      --success-bg: #143521;
      --success-text: #4ade80;
      --success-border: #166534;
      --step-bg: #202024;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Bar */
    header {
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
    }
    .header-title {
      font-weight: 600;
      font-size: 15px;
      color: var(--text);
      letter-spacing: -0.2px;
    }
    .theme-toggle-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .theme-toggle-btn:hover {
      background: var(--surface);
      color: var(--text);
    }
    .theme-toggle-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* Chat Messages Stream */
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      scroll-behavior: smooth;
    }
    .chat-inner {
      max-width: 768px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-height: 100%;
    }

    /* Minimal Empty State */
    .empty-state {
      margin: auto 0;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      padding: 40px 0;
    }

    /* Message Bubbles */
    .msg-row {
      display: flex;
      gap: 12px;
      width: 100%;
    }
    .msg-row.user {
      justify-content: flex-end;
    }
    .msg-row.bot {
      justify-content: flex-start;
    }

    .msg-bubble {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.6;
      word-wrap: break-word;
    }
    .msg-row.user .msg-bubble {
      background: var(--msg-user);
      color: var(--text);
    }
    .msg-row.bot .msg-bubble {
      background: var(--msg-bot);
      color: var(--text);
      border: 1px solid var(--border);
      width: 100%;
      max-width: 100%;
    }

    /* Live Procedural Step Tracker */
    .step-tracker {
      background: var(--step-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 14px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12.5px;
    }
    .step-line {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .step-status-icon {
      font-size: 11px;
      width: 16px;
      text-align: center;
    }
    .step-line.done .step-status-icon { color: var(--success-text); font-weight: bold; }
    .step-line.running .step-status-icon { color: var(--primary); font-weight: bold; }
    .step-line.pending .step-status-icon { color: var(--text-muted); }
    .step-name { font-weight: 500; }
    .step-detail { color: var(--text-muted); font-size: 11.5px; font-family: 'JetBrains Mono', monospace; margin-left: auto; }

    /* Verdict Card */
    .verdict-box {
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .verdict-header {
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 700;
      font-size: 13.5px;
    }
    .verdict-header.malware {
      background: var(--danger-bg);
      color: var(--danger-text);
      border: 1px solid var(--danger-border);
    }
    .verdict-header.benign {
      background: var(--success-bg);
      color: var(--success-text);
      border: 1px solid var(--success-border);
    }
    .confidence-tag {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.05);
    }

    .verdict-title {
      font-size: 11.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-top: 12px;
      margin-bottom: 6px;
    }
    .verdict-purpose {
      font-size: 13.5px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: 6px;
    }
    .findings-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .findings-list li {
      font-size: 13px;
      padding: 6px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }
    .findings-list li::before {
      content: "•";
      color: var(--primary);
      font-weight: bold;
    }
    details {
      margin-top: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
    }
    summary {
      padding: 8px 12px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
    }
    .details-text {
      padding: 10px 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      white-space: pre-wrap;
      word-wrap: break-word;
      border-top: 1px solid var(--border);
      max-height: 220px;
      overflow-y: auto;
      color: var(--text-muted);
    }

    /* Fixed Bottom Chatbar */
    .chatbar-container {
      padding: 12px 16px 20px;
      background: var(--bg);
      flex-shrink: 0;
    }
    .chatbar-box {
      max-width: 768px;
      margin: 0 auto;
      background: var(--chatbar-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .chatbar-box:focus-within {
      border-color: var(--border-focus);
    }
    .chatbar-input-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }
    textarea#msg-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      resize: none;
      outline: none;
      max-height: 140px;
      min-height: 24px;
      line-height: 1.5;
    }
    textarea#msg-input::placeholder {
      color: var(--text-muted);
    }
    .chatbar-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 4px;
      border-top: 1px solid var(--border);
    }
    .chatbar-tools {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .upload-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 12.5px;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 6px;
      border-radius: 4px;
      transition: background 0.15s, color 0.15s;
    }
    .upload-btn:hover {
      background: var(--surface-2);
      color: var(--text);
    }
    .model-select-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .model-select-wrapper select {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 12px;
      padding: 3px 6px;
      border-radius: 4px;
      font-family: inherit;
      outline: none;
      cursor: pointer;
    }
    .send-btn {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      transition: background 0.15s, opacity 0.15s;
      flex-shrink: 0;
    }
    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header>
    <div class="header-title">Malware Detector</div>
    <button class="theme-toggle-btn" id="theme-btn" onclick="toggleTheme()" title="Toggle Theme">
      <svg id="theme-icon-sun" viewBox="0 0 24 24" style="display:none;"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
      <svg id="theme-icon-moon" viewBox="0 0 24 24"><path d="M12.3 2a10 10 0 0 0-.19 20 10 10 0 0 0 8.39-4.52.75.75 0 0 0-.8-1.1A8.5 8.5 0 0 1 11.5 3.5a8.39 8.39 0 0 1 1.9-.22.75.75 0 0 0 .65-1.12A10 10 0 0 0 12.3 2z"/></svg>
    </button>
  </header>

  <!-- Messages Stream -->
  <div id="chat-container">
    <div class="chat-inner" id="chat-inner">
      <div class="empty-state" id="empty-state">
        Paste a SHA-256 hash or upload an APK file to analyze.
      </div>
    </div>
  </div>

  <!-- Bottom Input Bar -->
  <div class="chatbar-container">
    <div class="chatbar-box">
      <div class="chatbar-input-row">
        <textarea id="msg-input" rows="1" placeholder="Paste a SHA-256 hash or ask a question..." oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="send-btn" onclick="handleSend()" title="Send">↑</button>
      </div>

      <div class="chatbar-footer">
        <div class="chatbar-tools">
          <input type="file" id="apk-file-input" accept=".apk" style="display:none;" onchange="handleFileUpload(this.files[0])">
          <button class="upload-btn" onclick="document.getElementById('apk-file-input').click()">📎 Upload APK</button>
          
          <div class="model-select-wrapper">
            <span>Model:</span>
            <select id="backend-select">
              <option value="gemini">Gemini 2.5 Flash</option>
              <option value="groq">Groq (Llama 3.3)</option>
              <option value="gguf">Local Dual-GPU (32B)</option>
            </select>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentSha = null;
    let activeJobTimer = null;

    // Theme Switcher
    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('lamd-theme', theme);
      const isDark = theme === 'dark';
      document.getElementById('theme-icon-sun').style.display = isDark ? 'block' : 'none';
      document.getElementById('theme-icon-moon').style.display = isDark ? 'none' : 'block';
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      setTheme(current === 'light' ? 'dark' : 'light');
    }

    // Auto-resize textarea
    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 140) + 'px';
    }

    function clearEmptyState() {
      const empty = document.getElementById('empty-state');
      if (empty) empty.remove();
    }

    function appendUserMessage(text) {
      clearEmptyState();
      const inner = document.getElementById('chat-inner');
      const row = document.createElement('div');
      row.className = 'msg-row user';
      row.innerHTML = `<div class="msg-bubble">${escapeHtml(text)}</div>`;
      inner.appendChild(row);
      scrollToBottom();
    }

    function appendBotMessage(initialHtml = '') {
      clearEmptyState();
      const inner = document.getElementById('chat-inner');
      const row = document.createElement('div');
      row.className = 'msg-row bot';
      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.innerHTML = initialHtml;
      row.appendChild(bubble);
      inner.appendChild(row);
      scrollToBottom();
      return bubble;
    }

    function scrollToBottom() {
      const c = document.getElementById('chat-container');
      c.scrollTop = c.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    // Submit Hash
    async function submitHash(sha) {
      appendUserMessage(`Analyze SHA-256: ${sha}`);
      currentSha = sha;
      const backend = document.getElementById('backend-select').value;
      const botBubble = appendBotMessage('<div class="step-tracker">Checking database & local CFG caches...</div>');

      try {
        const resp = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sha256: sha, backend: backend })
        });
        const data = await resp.json();

        if (data.status === 'cached') {
          renderVerdictInBubble(botBubble, data.result, "Loaded from cache (0 LLM tokens wasted)");
        } else if (data.job_id) {
          pollJobProgress(data.job_id, botBubble);
        } else {
          botBubble.innerHTML = `<span style="color:var(--danger-text);">${data.error || 'Please provide a valid SHA-256 hash or upload an APK file to analyze.'}</span>`;
        }
      } catch (e) {
        botBubble.innerHTML = `<span style="color:var(--danger-text);">Network error: ${e}</span>`;
      }
    }

    // Handle File Upload
    async function handleFileUpload(file) {
      if (!file || !file.name.endsWith('.apk')) {
        alert('Please select a valid Android .apk file.');
        return;
      }
      appendUserMessage(`Uploaded APK: ${file.name} (${Math.round(file.size/1024)} KB)`);
      const backend = document.getElementById('backend-select').value;
      const botBubble = appendBotMessage('<div class="step-tracker">Uploading APK to analyzer...</div>');

      const formData = new FormData();
      formData.append('file', file);
      formData.append('backend', backend);

      try {
        const resp = await fetch('/api/upload', { method: 'POST', body: formData });
        const data = await resp.json();

        if (data.status === 'cached') {
          currentSha = data.result.sha256;
          renderVerdictInBubble(botBubble, data.result, "Previously analyzed APK");
        } else if (data.job_id) {
          currentSha = data.sha256;
          pollJobProgress(data.job_id, botBubble);
        } else {
          botBubble.innerHTML = `<span style="color:var(--danger-text);">${data.error || 'Upload failed.'}</span>`;
        }
      } catch (e) {
        botBubble.innerHTML = `<span style="color:var(--danger-text);">Error: ${e}</span>`;
      }
    }

    // Handle General Send
    async function handleSend() {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      input.style.height = 'auto';

      // Check if text contains a 64-char hex SHA-256
      const shaMatch = text.match(/[a-fA-F0-9]{64}/);
      if (shaMatch) {
        submitHash(shaMatch[0].toLowerCase());
        return;
      }

      // If no active SHA has been analyzed yet, remind user to provide SHA or APK
      if (!currentSha) {
        appendUserMessage(text);
        appendBotMessage('Please provide a valid SHA-256 hash or upload an APK file to analyze.');
        return;
      }

      // Otherwise, it's a follow-up question about the current analyzed APK
      appendUserMessage(text);
      const botBubble = appendBotMessage('Analyzing...');
      const backend = document.getElementById('backend-select').value;

      try {
        const resp = await fetch('/api/explain', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sha256: currentSha,
            question: text,
            backend: backend
          })
        });
        const data = await resp.json();
        botBubble.innerText = data.reply || 'No response produced.';
      } catch (e) {
        botBubble.innerHTML = `<span style="color:var(--danger-text);">Error: ${e}</span>`;
      }
      scrollToBottom();
    }

    // Poll Job Progress
    function pollJobProgress(jobId, bubbleEl) {
      if (activeJobTimer) clearInterval(activeJobTimer);

      activeJobTimer = setInterval(async () => {
        try {
          const resp = await fetch(`/api/status/${jobId}`);
          const job = await resp.json();

          let stepsHtml = '<div class="step-tracker">';
          (job.steps || []).forEach((step) => {
            let icon = '○';
            if (step.status === 'done') icon = '✓';
            if (step.status === 'running') icon = '●';
            if (step.status === 'error') icon = '✕';

            stepsHtml += `
              <div class="step-line ${step.status}">
                <span class="step-status-icon">${icon}</span>
                <span class="step-name">${step.name}</span>
                <span class="step-detail">${step.detail || ''}</span>
              </div>
            `;
          });
          stepsHtml += '</div>';
          bubbleEl.innerHTML = stepsHtml;
          scrollToBottom();

          if (job.status === 'done') {
            clearInterval(activeJobTimer);
            renderVerdictInBubble(bubbleEl, job.result);
          } else if (job.status === 'error') {
            clearInterval(activeJobTimer);
            bubbleEl.innerHTML += `<div style="color:var(--danger-text); margin-top:8px;">✕ Analysis failed: ${escapeHtml(job.error)}</div>`;
          }
        } catch (e) {
          console.error('Polling error:', e);
        }
      }, 1000);
    }

    function renderVerdictInBubble(bubbleEl, res, note = '') {
      const isMalware = (res.prediction || '').toUpperCase() === 'MALWARE';
      const statusClass = isMalware ? 'malware' : 'benign';
      const tagText = isMalware ? 'MALWARE DETECTED' : 'BENIGN APPLICATION';
      const conf = (res.confidence || 'HIGH').toUpperCase();

      let findingsHtml = '';
      (res.key_findings || []).forEach(f => {
        findingsHtml += `<li>${escapeHtml(f)}</li>`;
      });

      let noteHtml = note ? `<div style="font-size:11.5px; color:var(--text-muted); margin-bottom:8px;">${note}</div>` : '';

      bubbleEl.innerHTML = `
        ${noteHtml}
        <div class="verdict-box">
          <div class="verdict-header ${statusClass}">
            <span>${tagText}</span>
            <span class="confidence-tag">CONFIDENCE: ${conf}</span>
          </div>
        </div>

        <div class="verdict-title">Application Purpose</div>
        <div class="verdict-purpose">${escapeHtml(res.app_purpose || 'Standard application behavior.')}</div>

        ${findingsHtml ? `<div class="verdict-title">Key Indicators & Findings</div><ul class="findings-list">${findingsHtml}</ul>` : ''}

        <details>
          <summary>Technical Analysis & Evidence</summary>
          <div class="details-text">${escapeHtml(res.evidence || res.analysis || 'No detailed analysis text.')}</div>
        </details>
      `;
      scrollToBottom();
    }

    // Keyboard support: Enter to send, Shift+Enter for newline
    document.getElementById('msg-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });

    // Init theme
    const savedTheme = localStorage.getItem('lamd-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    setTheme(savedTheme);
  </script>
</body>
</html>
